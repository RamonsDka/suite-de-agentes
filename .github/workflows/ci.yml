name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Build release package
        run: npm run package

      - name: Verify release package assets
        run: |
          test -f release/suite-de-agentes-v1.1.0.zip
          test -f release/suite-de-agentes-v1.1.0.tar.gz
          test -f release/SHA256SUMS.txt
          cd release && sha256sum -c SHA256SUMS.txt
