name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Build release package
        run: npm run package

      - name: Verify release package assets
        run: |
          cd release && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release create "$TAG_NAME" \
            release/*.zip \
            release/*.tar.gz \
            release/SHA256SUMS.txt \
            --title "Suite de Agentes $TAG_NAME" \
            --generate-notes \
            --verify-tag
